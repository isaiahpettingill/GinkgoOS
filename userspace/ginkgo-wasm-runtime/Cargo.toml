[package]
name = "ginkgo-wasm-runtime"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "ginkgo-wasm-runtime"
path = "src/main.rs"
test = false
bench = false

[dependencies]
ginkgo-runtime.workspace = true
ginkgo-terminal-protocol.workspace = true
ginkgo-userspace.workspace = true
wasmi = { version = "0.46.0", default-features = false, features = ["prefer-btree-collections"] }
